<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Safety Culture Assessment</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#1b2333;--muted:#5b6578;--line:#d7dce6;--navy:#1f3864;--accent:#2f6fd6;--chip:#e8eefb;--red:#c62828;--amber:#e0a100;--green:#2e7d32;--fac:#b26a00}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 -apple-system,"Segoe UI",Arial,"Noto Sans","Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:600}.spacer{flex:1}
.pill:empty{display:none}.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.15)}.pill.fac{background:#ffcc80;color:#3b2500}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
.layout{display:flex;min-height:calc(100vh - 48px)}
nav.side{width:200px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 8px}
nav.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
nav.side button:hover{background:var(--chip)}nav.side button.active{background:var(--navy);color:#fff}
main{flex:1;min-width:0;padding:16px 20px 60px;max-width:1100px}
h2{margin:0 0 4px;font-size:20px;color:var(--navy)}h3{margin:14px 0 6px;font-size:16px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 14px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}.btn.sm{padding:3px 9px;font-size:13px}.btn:disabled{opacity:.45}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 14px}
.tw{overflow:auto}table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.t th{background:#eef1f7}
.num{text-align:right!important;white-space:nowrap}.muted{color:var(--muted)}.small{font-size:12px}
.band{display:inline-block;min-width:52px;text-align:center;border-radius:5px;padding:1px 6px;font-weight:600}
.b-r{background:#fbd5d5;color:#8a1c1c}.b-a{background:#ffefb3;color:#6b4d00}.b-g{background:#cdebd0;color:#1b5e20}.b-n{background:#eee;color:#666}
.note{background:#fff8e1;border:1px solid #f0d58a;border-radius:8px;padding:8px 12px;font-size:13px}
.facbox{border-left:4px solid var(--fac);background:#fff6ea;padding:8px 12px;border-radius:6px;font-size:13px}
/* survey */
.sv{max-width:720px;margin:0 auto}.stmt{padding:12px 0;border-bottom:1px solid var(--line)}.stmt p{margin:0 0 8px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.opts label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;cursor:pointer;background:#fff}
.opts input{position:absolute;opacity:0;pointer-events:none}.opts label:has(input:checked){background:var(--accent);color:#fff;border-color:var(--accent)}
.opts label.dk{background:#f3f3f3}.stmt.miss{background:#fff1f1}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--accent)}
.code{font:600 15px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#eef1f7;padding:10px;border-radius:8px;direction:ltr;text-align:left}
body.respond nav.side,body.respond #btnFile,body.respond #btnPrint,body.respond #mnav{display:none!important}
@media (max-width:760px){nav.side{display:none}.layout{display:block}main{padding:12px}.opts{grid-template-columns:repeat(3,minmax(0,1fr))}#mnav{display:block!important}}
@media print{header.top,nav.side,.noprint,#mnav{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{border:0;padding:0;break-inside:avoid}@page{size:A4;margin:14mm 12mm}}
</style>
</head>
<body>
<header class="top">
  <h1>Process Safety Culture Assessment</h1><span class="pill" id="asmtPill"></span><span class="pill fac" id="facPill" hidden>Facilitator edition – not for distribution</span>
  <span class="spacer"></span>
  <button class="hbtn" id="btnFile" title="Save the whole assessment to a .json file, or open one saved earlier">Save / open</button>
  <button class="hbtn" id="btnPrint" title="Print the results report, or choose Save as PDF in the print dialog" onclick="go('results');setTimeout(print,200)">Print report</button>
</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"><select id="mnav" class="noprint" style="display:none;margin-bottom:10px" onchange="go(this.value)" title="Choose a page"></select><div id="view"></div></main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
'use strict';
var LIB = {"source": "Based on the 10 core principles in CCPS (2018), Essential Practices for Creating, Strengthening, and Sustaining Process Safety Culture, AIChE / Wiley, Appendix F. Survey statements are original wording.", "langs": [{"id": "en", "name": "English", "dir": "ltr", "reviewed": true}, {"id": "ar", "name": "العربية", "dir": "rtl", "reviewed": false}], "principles": [{"id": "IMP", "name": "Establish an Imperative for Safety", "meaning": "Process safety is a core value that is acted on, beyond minimum compliance.", "names": {"ar": "ترسيخ ضرورة السلامة"}, "flags": ["PSMS scope limited to what the regulation names (compliance only)", "Small changes made without MOC", "Procedures exist on paper but are not used"]}, {"id": "LEAD", "name": "Provide Strong Leadership", "meaning": "Leaders are visible, consistent and give the resources process safety needs.", "names": {"ar": "توفير قيادة قوية"}, "flags": ["Key process safety posts vacant, or moved to a lower level", "Production targets regularly override safety decisions", "Leaders seldom seen in the plant"]}, {"id": "TRUST", "name": "Foster Mutual Trust", "meaning": "People can report errors and concerns without fear; the focus is on the system.", "names": {"ar": "تعزيز الثقة المتبادلة"}, "flags": ["People who raise concerns are sidelined (\"shoot the messenger\")", "Investigations stop at the person who erred", "Contractors kept out of safety meetings and hazard studies"]}, {"id": "COMM", "name": "Ensure Open and Frank Communications", "meaning": "Information, bad news and dissent flow freely, including to contractors.", "names": {"ar": "ضمان التواصل المفتوح والصريح"}, "flags": ["Shift handover is informal or not logged", "Incident lessons not shared with the front line", "Concerns are filtered or softened on their way up"]}, {"id": "VULN", "name": "Maintain a Sense of Vulnerability", "meaning": "People believe a major accident could happen here and stay alert to weak signals.", "names": {"ar": "الحفاظ على الشعور بإمكانية التعرض للخطر"}, "flags": ["\"It can't happen here\" attitude", "Clean audits or compliance taken as proof of safety", "Near-miss reports low, or falling with no reason"]}, {"id": "HAZ", "name": "Understand and Act Upon Hazards/Risks", "meaning": "Hazards are known at every level and risk-study actions are closed on time.", "names": {"ar": "فهم المخاطر والتعامل معها"}, "flags": ["Overdue PHA / HAZOP recommendations", "Alarms or trips bypassed without authorisation", "Front-line staff cannot name the main hazards"]}, {"id": "EMP", "name": "Empower Individuals to Successfully Fulfill their Safety Responsibilities", "meaning": "People have the authority, competence, time and tools to work safely.", "names": {"ar": "تمكين الأفراد من أداء مسؤولياتهم في السلامة بنجاح"}, "flags": ["Stop-work authority exists on paper but is not used", "Training or competence gaps in safety-critical tasks", "High workload, overtime or vacancies"]}, {"id": "EXP", "name": "Defer to Expertise", "meaning": "Decisions go to the people with the knowledge, not the highest rank.", "names": {"ar": "الاحتكام إلى الخبرة"}, "flags": ["Decisions made by rank, not knowledge", "Technical staff reluctant to challenge managers", "No clear technical authority for process safety"]}, {"id": "DEV", "name": "Combat the Normalization of Deviance", "meaning": "Drift from limits and procedures is noticed, reported and corrected.", "names": {"ar": "مكافحة تطبيع الانحراف"}, "flags": ["Operation outside limits tolerated", "Known faults and standing alarms left for months", "Procedures differ from how the work is done", "Repeated nuisance alarms ignored"]}, {"id": "LEARN", "name": "Learn to Assess and Advance the Culture", "meaning": "Investigations, audits and indicators drive real, checked improvement.", "names": {"ar": "تعلّم تقييم الثقافة والارتقاء بها"}, "flags": ["Repeat incidents with the same causes", "Actions closed without checking they worked", "Audits return only minor findings", "Only lagging indicators (injury rates) reported"]}], "items": [{"id": "IMP1", "p": "IMP", "rev": false, "t": {"en": "Process safety is treated here as a core value, not just a rule we must follow.", "ar": "تُعامَل سلامة العمليات هنا كقيمة أساسية، وليس مجرد قاعدة يجب اتباعها."}}, {"id": "IMP2", "p": "IMP", "rev": false, "t": {"en": "When production and safety conflict, safety wins.", "ar": "عندما يتعارض الإنتاج مع السلامة، تكون الأولوية للسلامة."}}, {"id": "IMP3", "p": "IMP", "rev": true, "t": {"en": "We do only the minimum the law requires for process safety.", "ar": "نحن نفعل الحد الأدنى فقط الذي يطلبه القانون في سلامة العمليات."}}, {"id": "IMP4", "p": "IMP", "rev": false, "t": {"en": "Every change to equipment, chemicals or procedures goes through management of change (MOC), even small changes.", "ar": "أي تغيير في المعدات أو المواد الكيميائية أو الإجراءات يمر دائماً عبر إدارة التغيير (MOC)، حتى التغييرات الصغيرة."}}, {"id": "IMP5", "p": "IMP", "rev": false, "t": {"en": "Our process safety procedures are used every day. They are not just kept on a shelf.", "ar": "إجراءات سلامة العمليات تُستخدم كل يوم، ولا تبقى حبراً على ورق."}}, {"id": "LEAD1", "p": "LEAD", "rev": false, "t": {"en": "Managers visit the plant and talk to us about process safety.", "ar": "يزور المديرون الموقع ويتحدثون معنا عن سلامة العمليات."}}, {"id": "LEAD2", "p": "LEAD", "rev": false, "t": {"en": "Leaders give enough people, time and money to fix process safety problems.", "ar": "يوفّر القادة ما يكفي من الأشخاص والوقت والمال لإصلاح مشكلات سلامة العمليات."}}, {"id": "LEAD3", "p": "LEAD", "rev": false, "t": {"en": "Leaders follow the same safety rules they expect us to follow.", "ar": "يلتزم القادة بقواعد السلامة نفسها التي يطلبون منا الالتزام بها."}}, {"id": "LEAD4", "p": "LEAD", "rev": false, "t": {"en": "Leaders praise people who stop a job because it is unsafe.", "ar": "يمدح القادة من يوقف عملاً لأنه غير آمن."}}, {"id": "LEAD5", "p": "LEAD", "rev": true, "t": {"en": "Managers only talk about safety after an incident.", "ar": "لا يتحدث المديرون عن السلامة إلا بعد وقوع حادث."}}, {"id": "TRUST1", "p": "TRUST", "rev": false, "t": {"en": "I can report a mistake I made without fear of unfair punishment.", "ar": "أستطيع الإبلاغ عن خطأ ارتكبته دون خوف من عقاب غير عادل."}}, {"id": "TRUST2", "p": "TRUST", "rev": false, "t": {"en": "After an incident, the focus is on fixing the system, not on finding someone to blame.", "ar": "بعد أي حادث، يكون التركيز على إصلاح النظام، وليس على البحث عن شخص لإلقاء اللوم عليه."}}, {"id": "TRUST3", "p": "TRUST", "rev": true, "t": {"en": "People who raise safety problems are treated as a nuisance.", "ar": "يُعامَل من يثير مشكلات السلامة على أنه مصدر إزعاج."}}, {"id": "TRUST4", "p": "TRUST", "rev": false, "t": {"en": "Contractors are treated with the same respect as our own employees on safety matters.", "ar": "يُعامَل المقاولون في أمور السلامة بالاحترام نفسه الذي يُعامَل به موظفونا."}}, {"id": "TRUST5", "p": "TRUST", "rev": false, "t": {"en": "I trust what management tells us about process safety.", "ar": "أثق بما تخبرنا به الإدارة عن سلامة العمليات."}}, {"id": "COMM1", "p": "COMM", "rev": false, "t": {"en": "Shift handover is done properly, with a log or a checklist.", "ar": "يتم تسليم واستلام المناوبة بشكل صحيح، باستخدام سجل أو قائمة تحقق."}}, {"id": "COMM2", "p": "COMM", "rev": false, "t": {"en": "I am told about incidents and near misses at this site, and what we learned from them.", "ar": "يتم إبلاغي بالحوادث والحوادث الوشيكة في هذا الموقع وبالدروس المستفادة منها."}}, {"id": "COMM3", "p": "COMM", "rev": false, "t": {"en": "I feel free to disagree with my supervisor about a safety issue.", "ar": "أشعر بالحرية في الاختلاف مع مشرفي حول مسألة تتعلق بالسلامة."}}, {"id": "COMM4", "p": "COMM", "rev": true, "t": {"en": "Bad news about process safety is hidden, or made to sound better than it is.", "ar": "تُخفى الأخبار السيئة عن سلامة العمليات أو تُعرض بصورة أفضل من حقيقتها."}}, {"id": "COMM5", "p": "COMM", "rev": false, "t": {"en": "Contractors get the safety information they need to work safely here.", "ar": "يحصل المقاولون على معلومات السلامة التي يحتاجونها للعمل بأمان هنا."}}, {"id": "VULN1", "p": "VULN", "rev": false, "t": {"en": "A serious fire, explosion or toxic release could happen at this site.", "ar": "يمكن أن يقع حريق أو انفجار أو تسرب سام خطير في هذا الموقع."}}, {"id": "VULN2", "p": "VULN", "rev": false, "t": {"en": "We learn from major accidents at other companies and in other industries.", "ar": "نتعلم من الحوادث الكبرى في الشركات والصناعات الأخرى."}}, {"id": "VULN3", "p": "VULN", "rev": true, "t": {"en": "We have not had a big accident for a long time, so people think it cannot happen here.", "ar": "لأننا لم نتعرض لحادث كبير منذ وقت طويل، يعتقد الناس أن ذلك لا يمكن أن يحدث هنا."}}, {"id": "VULN4", "p": "VULN", "rev": false, "t": {"en": "Near misses are reported and taken seriously.", "ar": "يتم الإبلاغ عن الحوادث الوشيكة وأخذها على محمل الجد."}}, {"id": "VULN5", "p": "VULN", "rev": true, "t": {"en": "People here believe that following the rules is enough to prevent a major accident.", "ar": "يعتقد الناس هنا أن اتباع القواعد يكفي لمنع وقوع حادث كبير."}}, {"id": "HAZ1", "p": "HAZ", "rev": false, "t": {"en": "I know the main process hazards in my area (for example toxic, flammable or high-pressure materials).", "ar": "أعرف مخاطر العمليات الرئيسية في منطقتي (مثل المواد السامة أو القابلة للاشتعال أو ذات الضغط العالي)."}}, {"id": "HAZ2", "p": "HAZ", "rev": false, "t": {"en": "Actions from hazard studies (such as HAZOP) are completed on time.", "ar": "تُنجَز الإجراءات الناتجة عن دراسات المخاطر (مثل HAZOP) في موعدها."}}, {"id": "HAZ3", "p": "HAZ", "rev": false, "t": {"en": "I know which alarms, trips and relief valves protect my area, and why they matter.", "ar": "أعرف ما هي الإنذارات وأنظمة الإيقاف وصمامات التنفيس التي تحمي منطقتي، ولماذا هي مهمة."}}, {"id": "HAZ4", "p": "HAZ", "rev": true, "t": {"en": "Safety-critical alarms and trips are bypassed without proper approval.", "ar": "يتم تجاوز (تعطيل) الإنذارات وأنظمة الإيقاف الحرجة للسلامة دون موافقة صحيحة."}}, {"id": "HAZ5", "p": "HAZ", "rev": false, "t": {"en": "When we find a new hazard, it is assessed and dealt with quickly.", "ar": "عندما نكتشف خطراً جديداً، يتم تقييمه والتعامل معه بسرعة."}}, {"id": "EMP1", "p": "EMP", "rev": false, "t": {"en": "I have the authority to stop a job if I believe it is unsafe.", "ar": "لديّ الصلاحية لإيقاف أي عمل إذا اعتقدت أنه غير آمن."}}, {"id": "EMP2", "p": "EMP", "rev": false, "t": {"en": "I have had the training I need to do my job safely.", "ar": "حصلت على التدريب الذي أحتاجه لأداء عملي بأمان."}}, {"id": "EMP3", "p": "EMP", "rev": false, "t": {"en": "I have the procedures, tools and information I need to work safely.", "ar": "لديّ الإجراءات والأدوات والمعلومات التي أحتاجها للعمل بأمان."}}, {"id": "EMP4", "p": "EMP", "rev": false, "t": {"en": "My job description makes my process safety responsibilities clear.", "ar": "الوصف الوظيفي الخاص بي يوضح مسؤولياتي في سلامة العمليات."}}, {"id": "EMP5", "p": "EMP", "rev": true, "t": {"en": "I am too busy, or we are too short of people, to do my safety tasks properly.", "ar": "أنا مشغول جداً، أو عدد العاملين قليل جداً، فلا أستطيع أداء مهام السلامة بشكل صحيح."}}, {"id": "EXP1", "p": "EXP", "rev": false, "t": {"en": "In a process upset, the person who knows the process best makes the call, whatever their rank.", "ar": "أثناء الاضطرابات في العملية، يتخذ القرار الشخص الأكثر معرفة بالعملية، مهما كانت رتبته."}}, {"id": "EXP2", "p": "EXP", "rev": false, "t": {"en": "Process safety decisions are made by people with the right technical knowledge.", "ar": "يتخذ قرارات سلامة العمليات أشخاص لديهم المعرفة الفنية المناسبة."}}, {"id": "EXP3", "p": "EXP", "rev": false, "t": {"en": "Experienced operators are asked for their views on designs and changes.", "ar": "يُطلب من المشغلين ذوي الخبرة إبداء آرائهم في التصاميم والتغييرات."}}, {"id": "EXP4", "p": "EXP", "rev": true, "t": {"en": "Senior staff overrule technical experts on safety issues to keep production going.", "ar": "يتجاوز كبار الموظفين رأي الخبراء الفنيين في مسائل السلامة من أجل استمرار الإنتاج."}}, {"id": "EXP5", "p": "EXP", "rev": false, "t": {"en": "We know who to call for expert process safety advice, day or night.", "ar": "نعرف بمن نتصل للحصول على مشورة خبير في سلامة العمليات، ليلاً أو نهاراً."}}, {"id": "DEV1", "p": "DEV", "rev": true, "t": {"en": "Small departures from procedures are accepted as normal here.", "ar": "تُقبَل المخالفات الصغيرة للإجراءات هنا على أنها أمر طبيعي."}}, {"id": "DEV2", "p": "DEV", "rev": false, "t": {"en": "Operating outside safe limits (for example pressure or temperature) is always reported and investigated.", "ar": "يتم دائماً الإبلاغ عن التشغيل خارج الحدود الآمنة (مثل الضغط أو درجة الحرارة) والتحقيق فيه."}}, {"id": "DEV3", "p": "DEV", "rev": false, "t": {"en": "Long-standing alarms, leaks and faults are fixed. We do not just live with them.", "ar": "يتم إصلاح الإنذارات والتسربات والأعطال القديمة، ولا نتعايش معها فقط."}}, {"id": "DEV4", "p": "DEV", "rev": false, "t": {"en": "Procedures are kept up to date, so they match how the work is really done.", "ar": "تُحدَّث الإجراءات باستمرار لتطابق طريقة أداء العمل فعلياً."}}, {"id": "DEV5", "p": "DEV", "rev": true, "t": {"en": "Shortcuts are accepted when they save time and \"nothing went wrong last time\".", "ar": "تُقبَل الطرق المختصرة عندما توفر الوقت و\"لم يحدث شيء خطأ في المرة الماضية\"."}}, {"id": "LEARN1", "p": "LEARN", "rev": false, "t": {"en": "Incident investigations here find the real (root) causes.", "ar": "تتوصل التحقيقات في الحوادث هنا إلى الأسباب الحقيقية (الجذرية)."}}, {"id": "LEARN2", "p": "LEARN", "rev": false, "t": {"en": "Actions from investigations and audits are completed and checked.", "ar": "تُنجَز الإجراءات الناتجة عن التحقيقات والتدقيقات ويتم التحقق منها."}}, {"id": "LEARN3", "p": "LEARN", "rev": false, "t": {"en": "Audits are seen as a chance to improve, not as a punishment.", "ar": "يُنظر إلى التدقيق على أنه فرصة للتحسين، وليس عقاباً."}}, {"id": "LEAR /* ---------- response codes: PSC1-<code>-<group>-<50 digits 0..5>-<check> (0 = Don't know) ---------- */
function chk(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h + s.charCodeAt(i) * (i + 1)) % 97; return ('0' + h).slice(-2); }

  if (!m) return { err: 'not a response code' };
  if (chk(m[1]) !== m[5]) return { err: 'check digits do not match (typing error?)' };
  if (!G[m[3]]) return { err: 'unknown group ' + m[3] };

/* ---------- scoring ---------- */
// item score 0-100: (v-1)/4*100 with reverse items flipped; Don't know (0) left out
function val(it, v) { if (!v) return null; return ((it.rev ? 6 - v : v) - 1) / 4 * 100; }

  resp = resp || db.responses.filter(function (r) { return r.code === db.meta.code; });
  var min = LIB.minGroup, res = { n: resp.length, P: {}, items: [], groups: {} };
  LIB.groups.forEach(function (g) { res.groups[g.id] = resp.filter(function (r) { return r.g === g.id; }).length; });
  var side = function (s) { return resp.filter(function (r) { return G[r.g].side === s; }); };
  var pScore = function (rs, pid) { var xs = []; rs.forEach(function (r) { LIB.items.forEach(function (it, i) { if (it.p === pid) { var x = val(it, r.a[i]); if (x !== null) xs.push(x); } }); }); return mean(xs); };

    var o = { all: pScore(resp, p.id), groups: {} }, M = side('M'), F = side('F');
    LIB.groups.forEach(function (g) { var rs = resp.filter(function (r) { return r.g === g.id; }); o.groups[g.id] = rs.length >= min ? pScore(rs, p.id) : null; });
    o.gap = M.length >= min && F.length >= min ? pScore(M, p.id) - pScore(F, p.id) : null;
    var rv = db.review[p.id]; o.fac = rv && rv.rating ? rv.rating : null;

  LIB.principles.forEach(function (p, i) { var e = pt(i, 100), l = pt(i, 116); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '" stroke="#d7dce6"/><text x="' + l[0] + '" y="' + l[1] + '" text-anchor="middle" dominant-baseline="middle"><title>' + esc(p.name) + '</title>' + p.id + '</text>'; });
  var poly = function (f, col, dash) { var pts = LIB.principles.map(function (p, i) { var v = f(p); return v == null ? null : pt(i, v).join(','); }); if (pts.some(function (x) { return x == null; })) return ''; return '<polygon points="' + pts.join(' ') + '" fill="' + col + '" fill-opacity=".15" stroke="' + col + '" stroke-width="2"' + (dash ? ' stroke-dasharray="5 4"' : '') + '/>'; };
  s += poly(function (p) { return res.P[p.id].all; }, '#2f6fd6') + poly(function (p) { return facPct(res.P[p.id].fac); }, '#b26a00', 1);

function loadSample() {
  db = blank(); db.meta.title = 'Example – Site A process unit'; db.meta.site = 'Site A (fictitious)'; db.meta.facilitator = 'Course facilitator'; db.meta.code = 'DEMO';
  var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  var base = { IMP: 3.6, LEAD: 3.5, TRUST: 3.1, COMM: 3.3, VULN: 3.0, HAZ: 2.9, EMP: 3.4, EXP: 3.3, DEV: 2.6, LEARN: 3.1 };
  var mix = [['MGR', 8], ['SUP', 10], ['OPS', 22], ['MNT', 10], ['ENG', 4], ['CON', 6]];
  mix.forEach(function (m) {
    var lift = G[m[0]].side === 'M' ? 0.7 : G[m[0]].side === 'F' ? -0.15 : 0.2;
    for (var k = 0; k < m[1]; k++) {
      var a = LIB.items.map(function (it) { if (rnd() < 0.05) return 0; var v = Math.round(base[it.p] + lift + (rnd() - 0.5) * 2.2); v = Math.max(1, Math.min(5, v)); return it.rev ? 6 - v : v; });
      addResponse('DEMO', m[0], a, 'example');

  db.review = { DEV: { rating: 2, flags: [1, 2], evidence: 'Eleven standing alarms older than 3 months on the unit console; two temporary clamps on a process line since last turnaround.' }, HAZ: { rating: 2, flags: [0], evidence: '14 HAZOP recommendations overdue, oldest 26 months.' }, LEAD: { rating: 3, flags: [], evidence: 'Leaders visit monthly; front line says visits are mostly about production.' } };
